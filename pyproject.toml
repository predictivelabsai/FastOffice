[project]
name = "fastoffice"
version = "0.1.0"
description = "Open-source productivity suite control plane and AI workspace"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44.0",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "python-fasthtml>=0.12",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
